<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="伟康技术小站：分享系统设计与技术生活理念。架构取舍、工具哲学与工程秩序——光与代码，塑成日常。"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!--
      公开文章 API（无需登录，返回 JSON）：
      - GET /api/posts — 已发布文章列表，响应 { "posts": [{ "title", "slug", "excerpt", "tags", "publishedAt", ... }] }
      - GET /api/posts/:slug — 单篇已发布文章，响应 { "post": { "title", "slug", "content", "excerpt", "tags", "publishedAt", ... } }
      默认仅返回 status=published 的文章；草稿与归档需登录并使用 ?visibility=all。
    -->
    <title>伟康技术小站</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("light", theme === "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
